# frontmatter.schema.yaml — aeps-llm-wiki-plugin wiki 前置元数据校验规约
#
# 权威性:plugin 本体单一权威(Single Source of Truth,DESIGN.md §2.5)
# 引用方:scripts/validate-frontmatter.py(本轮实现)+ SKILL.md(后续)
# 字段说明:详见 src/design.md §3.6 + templates/source-page.md

---
# JSON Schema(供 jsonschema 库消费,Draft 7)
$schema: "http://json-schema.org/draft-07/schema#"

# 通用必填字段(全 wiki 适用,DESIGN.md §2.5 §通用必填)
required:
  - type
  - title
  - description
  - updated
  - tags

properties:
  type:
    type: string
    description: "OKF v0.2 §4.1 必填;plugin 18 合法值"

  title:
    type: string
    description: "OKF §4.1 推荐"

  description:
    type: string
    description: "OKF §4.1 推荐;一句话短摘要"

  updated:
    type: string
    description: "ISO 8601 时间戳;plugin 扩展(Q7 死循环防护)"

  tags:
    type: array
    description: "六轴受控词表;docform/ 单值必填"
    items:
      type: string
    minItems: 1

  status:
    type: string
    enum: ["draft", "stable", "deprecated"]
    description: "插件扩展;默认 stable"

  # source 类型 G10 强校验(详见 templates/source-page.md + prd §4.2)
  source_file:
    type: string
    description: "顶层字符串;Obsidian UI 可点击;与 sources[0].resource 值相等(Q9 双字段同源)"

  sources:
    type: array
    description: "OKF v0.2 §5.1 必填数组;source 类型必填"

  format:
    type: string
    description: "原文件扩展名小写(G10 增量)"

  converter:
    type: ["string", "null"]
    enum: ["anydoc", "claude-native", "paddleocr", null]
    description: "实际转换器;null = 纯文本不转换"

  native_text:
    type: boolean
    description: "G10 三元组之一;true ⇔ converter=null ⇔ converted_path=null"

  converted_path:
    type: ["string", "null"]
    description: "G10 三元组之一;raw/<subdir>/<basename>.<ext>.converted.md 或 null"

  links:
    type: array
    description: "OKF v0.2 §9 镜像字段;plugin 自动维护"

  # analysis 类型 G11 强校验(详见 templates/analysis-page.md)
  sources_used:
    type: array
    description: "G11 必填;analysis 页参考的 wiki 页列表"
    items:
      type: string

  answer_to:
    type: string
    description: "G11 必填;原 query 问句原样保留"

  generated_by:
    type: string
    description: "G11 必填;plugin 格式 agent: producer/aeps-llm-wiki-plugin/<version>"

  summary:
    type: string
    description: "source / analysis 类型必填;≤ 280 字符"
    maxLength: 280

  # entity / concept 类型
  aliases:
    type: array
    description: "entity / concept 类型必填;同义 / 别名列表"
    items:
      type: string

  # synthesis 类型
  topic:
    type: string
    description: "synthesis 类型必填"

  sources_count:
    type: integer
    description: "synthesis 类型必填"
    minimum: 0

  last_updated:
    type: string
    description: "synthesis 类型必填;ISO 8601"

# 兼容 OKF §11 容忍:未知 type 仅 WARN,不 FAIL(validate-frontmatter 单独处理)
# 类型枚举与 design.md §3.1 §A 对齐
